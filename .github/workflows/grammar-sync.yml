name: Grammar sync with dpm-xl-docs

on:
  push:
    branches: ["master", "develop"]
  pull_request:
    branches: ["master", "develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grammar-sync:
    runs-on: ubuntu-latest

    env:
      DPM_XL_DOCS_RAW_ROOT: https://gitlab.com/aollerosr/dpm-xl-docs/-/raw
      DPM_XL_DOCS_BRANCHES: "dev main"
      LOCAL_GRAMMAR_DIR: src/dpmcore/dpm_xl/grammar

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compare grammar with dpm-xl-docs (dev or main branch)
        run: |
          set -uo pipefail

          files="dpm_xlLexer.g4 dpm_xlParser.g4"
          diff_dir="$(mktemp -d)"
          matched_branches=""

          for branch in $DPM_XL_DOCS_BRANCHES; do
            branch_ok=1

            for file in $files; do
              remote_file="$(mktemp)"
              url="${DPM_XL_DOCS_RAW_ROOT}/${branch}/docs/grammar/${file}"

              if ! curl -fsSL "$url" -o "$remote_file"; then
                echo "::warning::Could not download ${file} from dpm-xl-docs ${branch} branch (${url})"
                branch_ok=0
                continue
              fi

              if ! diff -u "${LOCAL_GRAMMAR_DIR}/${file}" "$remote_file" > "${diff_dir}/${branch}-${file}.diff"; then
                branch_ok=0
              fi
            done

            if [ "$branch_ok" -eq 1 ]; then
              echo "Grammar matches dpm-xl-docs (${branch} branch)."
              matched_branches="${matched_branches} ${branch}"
            else
              echo "Grammar does not match dpm-xl-docs (${branch} branch)."
            fi
          done

          if [ -z "$matched_branches" ]; then
            for branch in $DPM_XL_DOCS_BRANCHES; do
              for file in $files; do
                if [ -s "${diff_dir}/${branch}-${file}.diff" ]; then
                  echo "::group::${file} differs from dpm-xl-docs (${branch} branch)"
                  cat "${diff_dir}/${branch}-${file}.diff"
                  echo "::endgroup::"
                fi
              done
            done
            echo "::error::Grammar files match neither the dev nor the main branch of dpm-xl-docs"
            echo ""
            echo "This check only verifies synchronization; update dpm-xl-docs manually to match dpmcore."
            exit 1
          fi

          echo "Grammar is in sync with dpm-xl-docs branch(es):${matched_branches}"
