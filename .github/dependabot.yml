# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Only touch pyproject.toml when a new release falls outside the
    # declared range; otherwise just refresh poetry.lock. The default
    # strategy rewrote every `>=X` floor to the newest release, which
    # dropped the Ubuntu 24.04 (apt) versions the floors are meant to
    # accept.
    versioning-strategy: "increase-if-necessary"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
